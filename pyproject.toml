[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xforge"
version = "0.1.0"
description = "Design rule checking and generation for Xbattery hardware"
requires-python = ">=3.11"
license = { text = "Proprietary - Xbattery Energy Pvt. Ltd." }
authors = [{ name = "Harsh Thakur" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# DBC generation itself is dependency-free; cantools is only needed to parse
# a DBC back (the round-trip test, or anyone consuming the output downstream).
comms = ["cantools>=39.0"]
# The STEP reader. Heavy (OpenCASCADE) and not always loadable - Windows
# Smart App Control blocks one of its DLLs on some machines - so the IDF
# reader is the default board path and this stays optional.
viewer = ["cadquery-ocp>=8.0", "trimesh>=5.0", "pygltflib>=1.16"]

[project.scripts]
xforge = "xforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xforge = ["profiles/*.yaml", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Supplier-dependent tests are opt-in so the suite runs offline and in CI.
addopts = "-q -m 'not network'"
markers = [
    "network: hits a live supplier API; run with -m network",
]
