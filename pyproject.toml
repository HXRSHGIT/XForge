[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xforge"
version = "0.1.0"
description = "Design rule checking and generation for Xbattery hardware"
requires-python = ">=3.11"
license = { text = "Proprietary - Xbattery Energy Pvt. Ltd." }
authors = [{ name = "Harsh Thakur" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# STEP -> GLB for the 3D viewer. Heavy (OpenCASCADE), hence optional.
viewer = ["cadquery-ocp>=8.0", "trimesh>=5.0", "pygltflib>=1.16"]

[project.scripts]
xforge = "xforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xforge = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
